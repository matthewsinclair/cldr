# Example cldr configuration. Copy to ~/.config/cldr/config.toml and edit.
# Every value here is a placeholder.

[journal]
root = "~/Documents/Journal"
author = "Your Name"
# timezone = "Europe/London"   # the machine's zone when absent
templates = "~/.config/cldr/templates"

# Where you were: from each date on, the journal's wall clock is in this zone.
[[journal.zones]]
from = "2026-09-27"
zone = "Pacific/Auckland"

[[journal.zones]]
from = "2026-12-20"
zone = "Europe/London"

# include and exclude match substrings of "calendar (account)"; an empty include reads every
# calendar. me: your own addresses, to read your reply to an invitation.
[calendar]
source = "busycal"
# store = "~/path/to/the/store"   # the store's standard location when absent
include = ["you@example.com", "you@work.example"]
exclude = ["Holidays"]
me = ["you@example.com", "you@work.example"]

[tags]
"@acme" = "@Acme"
"@self" = "@Self"

# Billable fraction per tag, 0 to 1; unlisted tags bill nothing. A Day Notes table may add a
# Bill column after Hours (| Project | Time | Hours | Bill | What |) to override a row.
[bill]
"@Acme" = 1.0

# What counts as work and what is flagged: each key is a rule in the Rules section of
# docs/notes/tn0001-cldr-design-note.md.
[rules]
exclude = ["[GYM]", "@personal"]
zero_hours = ["Travel:"]
weekday_only = ["@Acme"]
min_weekday_hours = 8.0
max_gap_hours = 1.0

# cldr month new: the files a month starts with (templates in journal.templates) and the links
# at the journal root that follow the current month.
[month.templates]
"day-notes" = "day-notes.md"
"link-dump" = "link-dump.md"

[month.links]
"day_notes.md" = "day-notes"
"link_dump.md" = "link-dump"
"daily_briefing.md" = "daily-briefing"

# cldr briefing: from cutover_hour on, the default briefing is tomorrow's. Each block is a
# section filled from a command's output, eg a list of open projects.
[briefing]
cutover_hour = 15

[[briefing.blocks]]
name = "projects"
heading = "Projects"
command = ["~/bin/open-projects"]
